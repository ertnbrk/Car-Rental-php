services:
  app:
    build:
      context: .
      dockerfile: docker/php-fpm.Dockerfile
    container_name: car-rental-app
    volumes:
      - ./:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-local}
      - CONTAINER_ROLE=app
    networks:
      - car-rental-network

  web:
    image: nginx:1.25-alpine
    container_name: car-rental-web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - car-rental-network

  db:
    image: mysql:8.4
    container_name: car-rental-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-car_rental}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-33060}:3306"
    volumes:
      - car-rental-dbdata:/var/lib/mysql
    command: --mysql-native-password=ON
    networks:
      - car-rental-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5-fpm-alpine
    container_name: car-rental-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - car-rental-network

  redis:
    image: redis:7-alpine
    container_name: car-rental-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - car-rental-redisdata:/data
    command: redis-server --appendonly yes
    networks:
      - car-rental-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Commented out until Laravel is fully installed and working
